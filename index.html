<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="shortcut icon" href="imgs/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/fontawesome.min.css"> 

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><!-- Link para a versão mais recente do Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!--BIBLIOTECA DE DATA-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>


    <style>
        html, body{
            min-height: 100vh;
        }

        body{
            background-image: url('imgs/wallpaper.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        h1{
            font-weight: bold;
            background: linear-gradient(to right, #771919, #FAA9A8); /* Degradê */
            -webkit-background-clip: text; /* Aplica o fundo ao texto */
            -webkit-text-fill-color: transparent; /* Torna o texto transparente */
        }
        h4{
            line-height: 5px;
        }

        ul li{
            color: white;
        }


        h5{
            color: rgb(215, 255, 215);
        }

        .container-cards{
            display: flex;
            gap: 10px;
            flex-wrap: nowrap;
        }

        .quadro{
            width: 400px;
            background-color: rgba(0, 0, 0, 0.219);
        }

        .done{
            text-decoration: line-through;
        }

        .inputTask{
            background: transparent;
            border: none;
            display: inline;
            width: auto;
        }
    </style>

</head>
<body>
    <div id="app" class="container-lg mb-5">
        <header class="p-3">
            <h1 class="text-center text-white">{{saudacao}}</h1>   
        </header>
        

        <main>
            <!--SESSÃO DE CRIAÇÃO DO QUADRO-->
            <div class="d-flex align-items-center gap-2 my-3">
                <input type="text" placeholder="Título do quadro" v-model="newNote.text" v-on:keyup.enter="addList(); storeList()" class="form-control bg-opacity-50">
                <div class="btn bg-secondary px-4 text-white" v-on:click="addList(); storeList()">Criar</div>
            </div>









            <!--CONTAINER DOS QUADROS-->
            <div class="card bg-dark bg-opacity-50">
                <div class="card-header border-0 bg-dark bg-opacity-25">
                    <h5 class="text-white">Quadros: {{n_quadros}}</h5>
                </div>

            
                <div class="container-cards card-body overflow-auto">
                    <!--quadro-->
                    <div 
                    name="quadro"
                    v-for="(list, i) in lists"                    
                    class="quadro card p-2 shadow"
                    >
                        <header>
                            <div class="d-flex justify-content-between">
                                <div class="d-flex gap-1">
                                    <!-- <input type="text"  
                                    id="datepicker" 
                                    placeholder="Data de conclusão" 
                                    v-model="dataConclusao" 
                                    class="form-control w-50"
                                    v-on:input="addDataConclusao(i)"
                                    /> -->

                                    <p class="pt-2" :class="list.conclusao == dataHoje() ? 'text-danger' : ''">
                                        {{list.conclusao}}
                                    </p>
                                    <!-- {{teste}}            -->
                                </div>
                                <!--<p class="text-center">{{list.data}}</p>-->
                                <button class="btn bg-light shadow" @click="this.lists.splice(i, 1); saveDelete()"><i class="fa-solid fa-trash text-danger"></i></button>  
                            </div>
                        
                            <input type="text"
                             v-model="list.text" 
                             v-on:input="editTitle(i)" 
                             class="d-inline border-0 bg-transparent fs-5" 
                             style="outline: none; color: rgb(255, 255, 255); font-weight: bold;"
                             title="Editar"
                            >
                            <hr class="border-white" style="margin-top: -1px;"> 
                        </header>
                        

                        <ul>
                            <li
                            class="mb-3" 
                            v-for="(task, i) in list.tasks">
                                <div  @click="task.done = !task.done; storeList()" :class="{done : task.done}">
                                    <span style="color: rgb(206, 255, 224);"><strong>{{task.data}}: </strong></span> 
                                    <span>{{task.task}}</span>    
                                </div>
                                
                                
                            </li>
                        </ul>

                        <div class="d-flex gap-2">
                            <input type="text" class="form-control" v-model="newTask.task" placeholder="Adicionar tarefa">
                            <button @click.stop="addTask(i, dataHoje())" class="btn bg-light text-white"><i class="fa-solid fa-plus text-secondary"></i></button>
                        </div>
                    </div>                   
                </div>                
            </div>







            <!--BTN APAGAR QUADROS-->
            <div 
            class="btn bg-danger text-white mt-2 shadow"
            v-on:click="lists = []; storeList()"
            v-if="lists.length >= 1"
            >
                Apagar tudo
            </div>
        </main>
    </div>
</body>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script><!--Link do Vuejs-->
<script src="script.js"></script>

<script>
    flatpickr("#datepicker", {
        dateFormat: "d/m/Y",
        locale: "pt"
    });
</script>
</html>
